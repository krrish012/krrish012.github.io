<!-- ============ DESKTOP ============ -->

      <span class="d-label">sys_<wbr>profile.txt</span>
    </button>

    <button class="d-icon" type="button" data-app="desc" data-title="about_me.txt">
      <span class="d-tile">
        <!-- Document icon to replace the terminal icon -->
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="4" width="20" height="24" rx="2"/><path d="M10 12h12M10 16h12M10 20h8"/></svg>
      </span>
      <span class="d-label">about_<wbr>me.txt</span>
    </button>

    <button class="d-icon" type="button" data-app="physical" data-title="physical_layer.dat">
      <span class="d-tile">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13v6M7 10v12M25 10v12M29 13v6M7 16h18"/></svg>

      <span class="d-label">physical_<wbr>layer.dat</span>

    <button class="d-icon" type="button" data-app="media" data-title="media_archive.exe">
      <span class="d-tile">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 10h14a6 6 0 0 1 5.8 7.5l-1.3 5a3 3 0 0 1-5 1.3L19 21h-6l-3.5 2.8a3 3 0 0 1-5-1.3l-1.3-5A6 6 0 0 1 9 10z"/><path d="M10 14v4M8 16h4M21.5 15h.01M24 17.5h.01"/></svg>

    <button class="d-icon" type="button" data-app="comms" data-title="project_mantis.log">

        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h22v15H14l-6 5v-5H5z"/><path d="M10 13h12M10 17h7"/></svg>
      </span>
      <span class="d-label">project_<wbr>mantis.log</span>

<!-- 1. sys_profile.txt -->
<template id="tpl-profile">
  <p class="prompt">cat sys_profile.txt</p>
  <h1 class="doc-name">Mr. Krrish Katira</h1>
  <p class="doc-lede">19-year-old B.Tech Computer Science (Cybersecurity) student at VIT-AP University.</p>

  <dl class="kv">
    <dt>name</dt><dd>Krrish Katira</dd>
    <dt>age</dt><dd>19</dd>
    <dt>program</dt><dd>B.Tech Computer Science, Cybersecurity</dd>
    <dt>university</dt><dd>VIT-AP University</dd>
    <dt>focus</dt><dd>network defense, operational intelligence frameworks, full-stack development</dd>
    <dt>status</dt><dd><span class="dot"></span>online, open to collaborate</dd>
  </dl>

  <p class="hint">Open the other files on the desktop to see what else is running on this machine.</p>
</template>

<!-- 2. about_me.txt -->
<template id="tpl-desc">
  <p class="prompt">cat about_me.txt</p>
  <div class="text-doc" style="font-family: var(--font-sans); font-size: 14px; line-height: 1.7; color: #cfd9e2; padding: 4px 8px;">
    
    <p style="margin-bottom: 16px;">As a Computer Science professional specializing in cybersecurity, my core focus is on network defense, operational intelligence, and robust software architecture. My technical background is rooted in exploring the mechanics of systems security—leveraging tools like Kali Linux and actively engaging with deep-dive technical communities. I am driven by a dual mandate: engineering secure applications from the ground up and continuously optimizing hardware and digital environments.</p>
    
    <p style="margin-bottom: 16px;">I thrive on translating theoretical concepts into functional, real-world utility. Recently, I have architected and deployed full-stack inventory management systems, seamlessly integrating complex databases with intuitive graphical user interfaces, alongside engineering robust platforms that handle end-to-end flight booking logic. Beyond individual development, I help lead technical initiatives within a security-focused hacking chapter, collaborating with peers to deconstruct and neutralize emerging vulnerabilities.</p>
    
    <p>Off-screen, my discipline translates into a structured weightlifting routine and playing football. I am an avid traveler with a deep appreciation for historical architecture, always scoping out my next global destination. Whether I am custom-configuring desktop environments, reviving legacy hardware, or winding down with a game, I stay immersed in technology. I am always open to discussing cybersecurity trends, CTFs, or collaborative builds—feel free to initiate a handshake.</p>
    
  </div>
</template>

        <tr data-day="2"><td>Tue</td><td>Pull</td><td>Rows, pull-ups, curls</td><td class="num">16</td></tr>
        <tr data-day="3"><td>Wed</td><td>Legs</td><td>Squat, Romanian deadlift, calves</td><td class="num">18</td></tr>
        <tr data-day="4" class="rest"><td>Thu</td><td>Rest</td><td>Walk and mobility</td><td class="num">0</td></tr>
        <tr data-day="5"><td>Fri</td><td>Upper</td><td>Incline press, lat pulldown, lateral raises</td><td class="num">15</td></tr>
        <tr data-day="6"><td>Sat</td><td>Lower + core</td><td>Deadlift, lunges, planks</td><td class="num">15</td></tr>
        <tr data-day="0" class="rest"><td>Sun</td><td>Rest</td><td>Full recovery</td><td class="num">0</td></tr>
      </tbody>
    </table>
  </div>

  <h2 class="sec">Nutrition, today</h2>
